<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Брусника — проверка контрагента</title>
    <style>
        /* ===== СБРОС И БАЗА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f7f4;
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* ===== ШАПКА (минимальная) ===== */
        .header {
            padding: 20px 0 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1e1e1e;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }

        .logo-text {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-weight: 300;
            color: #6b6b6b;
        }

        .header-tag {
            font-size: 14px;
            color: #6b6b6b;
            background: #f0eeea;
            padding: 6px 16px;
            border-radius: 40px;
        }

        /* ===== ГЛАВНЫЙ БЛОК ===== */
        .hero {
            padding: 48px 0 32px;
            flex: 1;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.4px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .hero h1 strong {
            font-weight: 600;
        }

        .hero .sub {
            font-size: 18px;
            color: #4a4a4a;
            margin-bottom: 32px;
        }

        /* ===== КАРТОЧКА ПОИСКА ===== */
        .search-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 32px;
        }

        .search-card label {
            display: block;
            font-weight: 500;
            font-size: 15px;
            margin-bottom: 10px;
            color: #1e1e1e;
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 1px solid #dcdcdc;
            border-radius: 12px;
            font-size: 16px;
            background: #fcfcfc;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .search-row input:focus {
            outline: none;
            border-color: #b89b7b;
            box-shadow: 0 0 0 3px rgba(184, 155, 123, 0.15);
            background: #ffffff;
        }

        .search-row input::placeholder {
            color: #aaa;
        }

        .btn {
            padding: 14px 40px;
            background: #1e1e1e;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            background: #333;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #statusMessage {
            margin-top: 14px;
            font-size: 14px;
            color: #6b6b6b;
            min-height: 22px;
        }

        .error-message {
            color: #b33a3a;
            background: #fce8e8;
            padding: 10px 18px;
            border-radius: 10px;
        }

        /* ===== РЕЗУЛЬТАТЫ ===== */
        .results {
            display: none;
            margin-top: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 40px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0eeea;
            margin-bottom: 20px;
        }

        .company-name {
            font-size: 26px;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        .company-inn {
            font-size: 17px;
            color: #6b6b6b;
            font-weight: 400;
            margin-top: 2px;
        }

        .company-age {
            background: #f0eeea;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1e1e1e;
            white-space: nowrap;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 40px;
            margin-top: 6px;
        }

        .result-item {
            border-bottom: 1px solid #f0eeea;
            padding-bottom: 14px;
        }

        .result-item .label {
            font-size: 13px;
            font-weight: 400;
            color: #6b6b6b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .result-item .value {
            font-size: 19px;
            font-weight: 500;
            color: #1e1e1e;
            word-break: break-word;
        }

        .result-item .value small {
            font-size: 14px;
            font-weight: 400;
            color: #6b6b6b;
            margin-left: 6px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            background: #e6f0e6;
            color: #1d6b2e;
        }

        .status-badge.warning {
            background: #fff1e0;
            color: #b8681a;
        }

        .status-badge.danger {
            background: #fce8e8;
            color: #b33a3a;
        }

        .status-badge.neutral {
            background: #f0eeea;
            color: #4a4a4a;
        }

        .equity-note {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #f0eeea;
            font-size: 15px;
            color: #4a4a4a;
        }

        .equity-note strong {
            color: #1e1e1e;
        }

        .no-data {
            padding: 16px 0 8px;
            font-size: 17px;
            color: #6b6b6b;
            text-align: center;
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            margin-top: auto;
            padding: 24px 0 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            background: #ffffff;
            text-align: center;
            font-size: 14px;
            color: #6b6b6b;
        }

        .footer a {
            color: #1e1e1e;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
            margin: 0 12px;
        }

        .footer a:hover {
            border-bottom-color: #b89b7b;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 640px) {
            .search-card {
                padding: 24px 20px;
            }

            .search-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .results-card {
                padding: 24px 20px;
            }

            .result-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .company-name {
                font-size: 22px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .hero .sub {
                font-size: 16px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 0 14px;
            }

            .hero {
                padding: 28px 0 20px;
            }

            .hero h1 {
                font-size: 24px;
            }

            .header-tag {
                font-size: 12px;
                padding: 4px 12px;
            }

            .logo-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="container header-inner">
            <a href="#" class="logo">
                <div class="logo-icon">Б</div>
                <div class="logo-text">Брусника <span>· проверка</span></div>
            </a>
            <span class="header-tag">Оценка контрагента</span>
        </div>
    </header>

    <!-- ===== ГЛАВНЫЙ БЛОК ===== -->
    <section class="hero">
        <div class="container">

            <h1>Проверка <strong>контрагента</strong></h1>
            <p class="sub">Кредитоспособность и риск авансирования по данным ФНС</p>

            <!-- КАРТОЧКА ПОИСКА -->
            <div class="search-card">
                <label for="innInput">ИНН компании</label>
                <div class="search-row">
                    <input
                    type="text"
                    id="innInput"
                    placeholder="Введите 10 или 12 цифр"
                    maxlength="12"
                    inputmode="numeric"
                    autofocus
                    />
                    <button class="btn" id="checkBtn">Проверить</button>
                </div>
                <div id="statusMessage"></div>
            </div>

            <!-- РЕЗУЛЬТАТЫ -->
            <div class="results" id="resultsContainer">
                <div class="results-card">
                    <div id="resultsContent"></div>
                </div>
            </div>

        </div>
    </section>

    <!-- ===== ПОДВАЛ ===== -->
    <footer class="footer">
        <div class="container">
            © 2026 Брусника
            <a href="#">Политика конфиденциальности</a>
            <a href="#">Пользовательское соглашение</a>
        </div>
    </footer>

    <script>
        (function() {
            // DOM
            const innInput = document.getElementById('innInput');
            const checkBtn = document.getElementById('checkBtn');
            const statusMessage = document.getElementById('statusMessage');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsContent = document.getElementById('resultsContent');

            let isLoading = false;

            // ---- Вспомогательные ----
            function cleanINN(value) {
                return value.replace(/\D/g, '');
            }

            function isValidINN(value) {
                return /^\d{10}$|^\d{12}$/.test(value);
            }

            function formatNumber(num) {
                if (num === undefined || num === null || isNaN(num)) return '0';
                return Number(num).toLocaleString('ru-RU').replace(/,/g, ' ');
            }

            // ---- Рендер результатов (полностью соответствует выводу brusnika_prepay.py) ----
            function renderResults(data) {
                const {
                    inn,
                    shortName,
                    age,
                    bo,
                    year,
                    prepay,
                    maxDebt,
                    maxDebtShift,
                    credDay,
                    credDayShift,
                    equity
                } = data;

                const formattedMaxDebt = formatNumber(maxDebt);
                const formattedEquity = formatNumber(equity);

                // Текст для сдвигов
                let maxDebtShiftText = `(изменение ${maxDebtShift || '0%'})`;
                if (maxDebtShift && maxDebtShift !== '0%') {
                    const isNegative = maxDebtShift.startsWith('-');
                    const direction = isNegative ? 'ухудшение' : 'улучшение';
                    maxDebtShiftText = `(изменение ${maxDebtShift} ${direction})`;
                }

                let credDayShiftText = `(изменение ${credDayShift || '0%'})`;
                if (credDayShift && credDayShift !== '0%') {
                    const isPositive = credDayShift.startsWith('+');
                    const direction = isPositive ? 'ухудшение' : 'улучшение';
                    credDayShiftText = `(изменение ${credDayShift} — ${direction})`;
                }

                // Prepag
                let prepayStatus = '';
                let prepayClass = 'neutral';
                if (prepay === 'yes') {
                    prepayStatus = 'Авансирование допускается';
                    prepayClass = '';
                } else if (prepay === 'no' && maxDebt <= 0) {
                    prepayStatus = 'Авансирование не допускается, отрицательная кредитоспособность';
                    prepayClass = 'danger';
                } else {
                    prepayStatus = 'Авансирование не допускается';
                    prepayClass = 'warning';
                }

                // Бухгалтерия
                const boStatus = bo === 'yes' ? '✅ Данные найдены' : '❌ Данные бухгалтерской отчетности не найдены';
                const boClass = bo === 'yes' ? '' : 'warning';

                // Срок
                let credDayText = '';
                if (credDay === 0) {
                    credDayText = 'Срок выполнения обязательств определить не удалось.';
                } else if (credDay > 365) {
                    credDayText =
                        `Слишком большой срок выполнения обязательств, высокие риски нарушения условий договора ${credDayShiftText}`;
                } else {
                    credDayText = `Ориентировочный срок выполнения обязательств ${credDay} дней ${credDayShiftText}`;
                }

                // Сборка HTML
                let html = `
                    <div class="results-header">
                        <div>
                            <div class="company-name">${shortName}</div>
                            <div class="company-inn">ИНН ${inn}</div>
                        </div>
                        <div class="company-age">Возраст компании ${age} лет</div>
                    </div>
                    <div style="margin-bottom: 18px;">
                        <span class="status-badge ${boClass}">${boStatus}</span>
                    </div>
                `;

                if (bo === 'no') {
                    html += `<div class="no-data">Данные бухгалтерской отчетности не найдены</div>`;
                } else {
                    html += `
                        <div style="margin-bottom: 14px; font-weight: 500; color: #1e1e1e;">
                            Кредитоспособность рассчитывалась на данных ${year || '—'} года:
                        </div>
                        <div class="result-grid">
                            <div class="result-item">
                                <div class="label">Авансирование</div>
                                <div class="value">
                                    <span class="status-badge ${prepayClass}">${prepayStatus}</span>
                                </div>
                            </div>
                            <div class="result-item">
                                <div class="label">Сумма допустимого аванса</div>
                                <div class="value">${formattedMaxDebt} ₽ <small>${maxDebtShiftText}</small></div>
                            </div>
                            <div class="result-item">
                                <div class="label">Срок выполнения обязательств</div>
                                <div class="value" style="font-size: 16px;">${credDayText}</div>
                            </div>
                    `;

                    if (equity !== 0) {
                        html += `
                            <div class="result-item">
                                <div class="label">Стоимость чистых активов</div>
                                <div class="value">${formattedEquity} ₽ <small>(для оценки перспектив взыскания)</small></div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                }

                // Если бухгалтерии нет, но активы есть
                if (bo === 'no' && equity !== 0) {
                    html += `
                        <div class="equity-note">
                            <strong>Чистые активы:</strong> ${formattedEquity} ₽ (для оценки перспектив взыскания)
                        </div>
                    `;
                }

                resultsContent.innerHTML = html;
                resultsContainer.style.display = 'block';
                resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ---- Основной запрос ----
            async function checkCounterparty() {
                if (isLoading) return;

                const raw = innInput.value.trim();
                const inn = cleanINN(raw);

                // Валидация
                if (!inn) {
                    statusMessage.textContent = '⚠️ Введите ИНН';
                    statusMessage.style.color = '#b33a3a';
                    statusMessage.className = '';
                    resultsContainer.style.display = 'none';
                    return;
                }

                if (!isValidINN(inn)) {
                    statusMessage.textContent = '⚠️ ИНН должен содержать 10 или 12 цифр';
                    statusMessage.style.color = '#b33a3a';
                    statusMessage.className = '';
                    resultsContainer.style.display = 'none';
                    return;
                }

                // Блокировка
                isLoading = true;
                checkBtn.classList.add('loading');
                checkBtn.innerHTML = '<span class="spinner"></span> Загрузка...';
                statusMessage.textContent = '⏳ Отправка запроса...';
                statusMessage.style.color = '#6b6b6b';
                statusMessage.className = '';
                resultsContainer.style.display = 'none';

                try {
                    const response = await fetch('http://localhost:8000/api/check', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ inn })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || 'Ошибка сервера');
                    }

                    renderResults(data);
                    statusMessage.textContent = '✅ Готово';
                    statusMessage.style.color = '#1d6b2e';
                    statusMessage.className = '';

                } catch (error) {
                    console.error('Ошибка:', error);
                    statusMessage.textContent = `❌ ${error.message || 'Не удалось получить данные'}`;
                    statusMessage.style.color = '#b33a3a';
                    statusMessage.className = 'error-message';
                    resultsContainer.style.display = 'none';
                } finally {
                    isLoading = false;
                    checkBtn.classList.remove('loading');
                    checkBtn.innerHTML = 'Проверить';
                }
            }

            // ---- События ----
            checkBtn.addEventListener('click', checkCounterparty);

            innInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkCounterparty();
                }
            });

            innInput.addEventListener('input', () => {
                statusMessage.textContent = '';
                statusMessage.style.color = '#6b6b6b';
                statusMessage.className = '';
            });

            // Фокус при загрузке
            window.addEventListener('load', () => {
                innInput.focus();
            });

        })();
    </script>

</body>
</html>
